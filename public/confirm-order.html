<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Confirm Your Order — Kelsworth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header" id="site-header"></header>

<div id="main-content" tabindex="-1" class="container">
  <div class="static-page" style="max-width:560px;text-align:center;padding:60px 0">
    <div id="confirmState">
      <p>Confirming your order…</p>
    </div>
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/site.js"></script>
<script>
  mountChrome("");

  (async () => {
    const el = document.getElementById("confirmState");
    const token = new URLSearchParams(window.location.search).get("token");

    if (!token) {
      el.innerHTML = `<h1>Missing confirmation link</h1><p>This link looks incomplete. Please use the link from your WhatsApp message, or <a href="contact.html">contact us</a> for help.</p>`;
      return;
    }

    try {
      const res = await fetch(`/api/orders/confirm?token=${encodeURIComponent(token)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not confirm your order.");

      el.innerHTML = data.alreadyConfirmed
        ? `<h1>Already confirmed ✓</h1><p>Order <strong>${data.orderNumber}</strong> was already confirmed — thanks! We're getting it ready.</p>`
        : `<h1>Order confirmed ✓</h1><p>Thanks! Order <strong>${data.orderNumber}</strong> is confirmed and will be packed shortly.</p>`;
    } catch (err) {
      el.innerHTML = `<h1>Couldn't confirm this order</h1><p>${err.message} You can also reply "YES" on WhatsApp, or <a href="contact.html">contact us</a> and we'll sort it out.</p>`;
    }
  })();
</script>
</body>
</html>
