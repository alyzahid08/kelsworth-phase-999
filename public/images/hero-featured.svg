<svg viewBox="0 0 900 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="spot" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#3a3f52"/>
      <stop offset="55%" stop-color="#1c1e28"/>
      <stop offset="100%" stop-color="#14141a"/>
    </radialGradient>
    <linearGradient id="denim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4f74"/>
      <stop offset="100%" stop-color="#232f45"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1100" fill="url(#spot)"/>

  <!-- soft floor shadow -->
  <ellipse cx="450" cy="990" rx="260" ry="36" fill="#000" opacity="0.35"/>

  <!-- jacket body -->
  <g stroke="#171c28" stroke-width="3" stroke-linejoin="round">
    <path d="M330,230 L450,300 L570,230 L680,290 L720,430 L640,460 L636,410 L636,940 L264,940 L264,410 L260,460 L180,430 L220,290 Z" fill="url(#denim)"/>
    <!-- sleeves shading -->
    <path d="M636,410 L720,430 L700,700 L636,676 Z" fill="#1f2a40"/>
    <path d="M264,410 L180,430 L200,700 L264,676 Z" fill="#1f2a40"/>
  </g>

  <!-- collar -->
  <path d="M392,252 L450,300 L508,252 L500,300 C500,330 476,352 450,352 C424,352 400,330 400,300 Z" fill="#4a5d84" stroke="#171c28" stroke-width="3"/>

  <!-- center placket + stitching -->
  <g fill="none" stroke="#eef0e6" stroke-width="3.5" stroke-dasharray="9,7" opacity="0.85">
    <path d="M450,352 L450,940"/>
    <path d="M264,470 L636,470"/>
  </g>

  <!-- chest pockets -->
  <g fill="none" stroke="#eef0e6" stroke-width="3" stroke-dasharray="7,6" opacity="0.8">
    <path d="M320,410 L400,410 L400,480 L320,480 Z"/>
    <path d="M500,410 L580,410 L580,480 L500,480 Z"/>
  </g>

  <!-- rivets / buttons -->
  <g fill="#eef0e6" opacity="0.92">
    <circle cx="450" cy="330" r="6"/>
    <circle cx="450" cy="400" r="6"/>
    <circle cx="450" cy="470" r="6"/>
    <circle cx="450" cy="540" r="6"/>
    <circle cx="450" cy="610" r="6"/>
    <circle cx="360" cy="415" r="4.5"/>
    <circle cx="360" cy="475" r="4.5"/>
    <circle cx="540" cy="415" r="4.5"/>
    <circle cx="540" cy="475" r="4.5"/>
  </g>

  <!-- subtle rim light edge -->
  <path d="M330,230 L450,300 L570,230 L680,290 L720,430 L640,460"
        fill="none" stroke="#8fa3c9" stroke-width="2" opacity="0.35"/>
  <path d="M330,230 L450,300 L570,230 L220,290 L180,430 L260,460"
        fill="none" stroke="#8fa3c9" stroke-width="2" opacity="0.15"/>

  <!-- ground grain texture strip -->
  <g opacity="0.5">
    <rect x="0" y="1040" width="900" height="60" fill="#0e0f14"/>
  </g>
</svg>
