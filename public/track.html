<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Track Your Order — Kelsworth</title>
<meta name="description" content="Check the status of your Kelsworth order using your order number and email." />
<meta property="og:site_name" content="Kelsworth" />
<link rel="canonical" href="https://www.kelsworth.com/track.html" />
<meta property="og:title" content="Track Your Order — Kelsworth" />
<meta property="og:description" content="Check the status of your Kelsworth order using your order number and email." />
<meta property="og:type" content="website" />
<meta property="og:image" content="/images/og-banner.svg" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Track Your Order — Kelsworth" />
<meta name="twitter:description" content="Check the status of your Kelsworth order using your order number and email." />
<meta name="twitter:image" content="/images/og-banner.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header" id="site-header"></header>

<div id="main-content" tabindex="-1" class="container" style="max-width:640px;padding-top:20px;padding-bottom:90px">
  <div class="breadcrumb"><a href="index.html">Home</a> / <span>Track Order</span></div>
  <div class="collection-head">
    <h1>Track Your Order</h1>
    <p>Enter your order number and the email it was placed with.</p>
  </div>

  <form id="trackForm" style="display:flex;flex-direction:column;gap:14px;max-width:400px">
    <div class="field">
      <label for="orderNumber">Order Number</label>
      <input type="text" id="orderNumber" placeholder="KW-XXXXXXXX" required />
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required />
    </div>
    <button type="submit" class="btn" id="trackBtn">Track Order</button>
    <p id="trackError" style="display:none;color:var(--accent);font-size:13px"></p>
  </form>

  <div id="orderResult" style="margin-top:36px"></div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/site.js"></script>
<script>
  mountChrome("track");

  const STATUS_LABELS = {
    pending: "Pending",
    processing: "Processing",
    shipped: "Shipped",
    delivered: "Delivered",
    cancelled: "Cancelled",
  };

  document.getElementById("trackForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("trackBtn");
    const errorEl = document.getElementById("trackError");
    const resultEl = document.getElementById("orderResult");
    errorEl.style.display = "none";
    resultEl.innerHTML = "";
    btn.disabled = true;
    btn.textContent = "Looking up…";

    try {
      const order = await lookupOrder(
        document.getElementById("orderNumber").value.trim(),
        document.getElementById("email").value.trim()
      );
      resultEl.innerHTML = `
        <div style="border:1px solid var(--ink);padding:24px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
            <span style="font-family:var(--font-mono);font-size:13px">Order #${order.order_number}</span>
            <span style="font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid var(--ink);padding:5px 12px">${STATUS_LABELS[order.status] || order.status}</span>
          </div>
          <table style="width:100%;border-collapse:collapse;margin-bottom:16px">
            ${order.items
              .map(
                (i) => `<tr><td style="padding:6px 0;font-size:13px">${i.product_name} · Size ${i.size} × ${i.qty}</td><td style="padding:6px 0;font-size:13px;text-align:right;font-family:var(--font-mono)">${formatPKR(i.unit_price * i.qty)}</td></tr>`
              )
              .join("")}
          </table>
          <div style="font-family:var(--font-mono);font-size:13px;text-align:right;line-height:1.8">
            Subtotal: ${formatPKR(order.subtotal)}<br>
            Shipping: ${order.shipping === 0 ? "Free" : formatPKR(order.shipping)}<br>
            ${order.discount > 0 ? `Discount: −${formatPKR(order.discount)}<br>` : ""}
            <strong style="font-size:16px">Total: ${formatPKR(order.total)}</strong>
          </div>
        </div>`;
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = "block";
    } finally {
      btn.disabled = false;
      btn.textContent = "Track Order";
    }
  });
</script>
</body>
</html>
