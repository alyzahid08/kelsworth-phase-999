<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Products — Kelsworth Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1>Products</h1>
        <p>What's shown on the storefront — add, edit, or retire items here.</p>
      </div>
      <button class="btn" id="newProductBtn">+ Add Product</button>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <input type="text" id="searchInput" placeholder="Search products…" style="width:280px" />
        <select id="categoryFilter">
          <option value="all">All categories</option>
          <option value="cotton">Cotton Unstitched</option>
          <option value="wash-n-wear">Wash &amp; Wear</option>
          <option value="karandi">Karandi</option>
          <option value="khaddar">Khaddar</option>
          <option value="linen">Linen</option>
          <option value="blended">Blended Fabric</option>
          <option value="wallets">Wallets</option>
          <option value="caps">Caps</option>
          <option value="watches">Watches</option>
          <option value="bracelets">Bracelets</option>
        </select>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="lowStockOnly" style="width:15px;height:15px" /> Low/Out of Stock only</label>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th></th>
          <th>Name</th>
          <th>Category</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="productsBody">
        <tr class="empty-row"><td colspan="7">Loading…</td></tr>
      </tbody>
    </table>
  </main>
</div>

<div class="modal-overlay" id="productModal">
  <div class="modal-box">
    <button class="modal-close" id="closeModal">✕</button>
    <h3 id="modalTitle">Add Product</h3>
    <form id="productForm">
      <input type="hidden" id="productDbId" />
      <div class="form-grid">
        <div class="field">
          <label for="f_slug">Slug (URL id, e.g. vw-111)</label>
          <input type="text" id="f_slug" required />
        </div>
        <div class="field">
          <label for="f_name">Name</label>
          <input type="text" id="f_name" required />
        </div>
        <div class="field">
          <label for="f_category">Category</label>
          <select id="f_category" required>
            <option value="cotton">Cotton Unstitched</option>
            <option value="wash-n-wear">Wash &amp; Wear</option>
            <option value="karandi">Karandi</option>
            <option value="khaddar">Khaddar</option>
            <option value="linen">Linen</option>
            <option value="blended">Blended Fabric</option>
            <option value="wallets">Wallets</option>
            <option value="caps">Caps</option>
            <option value="watches">Watches</option>
            <option value="bracelets">Bracelets</option>
          </select>
        </div>
        <div class="field">
          <label for="f_fit">Fit</label>
          <select id="f_fit" required>
            <option value="2-piece">2 Piece</option>
            <option value="3-piece">3 Piece</option>
            <option value="regular">Regular (accessories)</option>
          </select>
        </div>
        <div class="field">
          <label for="f_color">Color</label>
          <input type="text" id="f_color" required />
        </div>
        <div class="field">
          <label for="f_badge">Badge</label>
          <select id="f_badge">
            <option value="">None</option>
            <option value="New">New</option>
            <option value="Sale">Sale</option>
          </select>
        </div>
        <div class="field">
          <label for="f_price">Price (Rs.)</label>
          <input type="number" id="f_price" min="0" required />
        </div>
        <div class="field">
          <label for="f_salePrice">Sale Price (Rs., optional)</label>
          <input type="number" id="f_salePrice" min="0" />
        </div>
        <div class="field full">
          <label for="f_sizes">Sizes (comma-separated)</label>
          <input type="text" id="f_sizes" placeholder="28, 30, 32, 34" required />
        </div>
        <div class="field full">
          <label>Stock per size</label>
          <div id="stockBySizeFields" style="display:flex;flex-wrap:wrap;gap:10px"></div>
          <p style="font-size:11.5px;color:var(--ink-soft);margin-top:6px">Enter sizes above first — a number field appears per size. Leave a size at 0 to show it as sold out.</p>
        </div>
        <div class="field full">
          <label for="f_image">Primary image path or URL</label>
          <input type="text" id="f_image" placeholder="/images/example.svg" required />
        </div>
        <div class="field full">
          <label for="f_images">Gallery images (comma-separated URLs, in display order)</label>
          <input type="text" id="f_images" placeholder="/images/a-front.svg, /images/a-back.svg, /images/a-detail.svg" />
        </div>
        <div class="field full">
          <label for="f_videoUrl">Product video URL (optional)</label>
          <input type="text" id="f_videoUrl" placeholder="/videos/example.mp4" />
        </div>
        <div class="field full">
          <label for="f_description">Description</label>
          <input type="text" id="f_description" />
        </div>
        <div class="field">
          <label for="f_fabric">Fabric / Material Composition</label>
          <input type="text" id="f_fabric" />
        </div>
        <div class="field">
          <label for="f_care">Care Instructions</label>
          <input type="text" id="f_care" />
        </div>
        <div class="field">
          <label for="f_sku">Base SKU</label>
          <input type="text" id="f_sku" placeholder="Defaults to slug if left blank" />
        </div>
        <div class="field">
          <label for="f_styleCode">Style code (groups color variants)</label>
          <input type="text" id="f_styleCode" placeholder="e.g. VW-101-STYLE" />
        </div>
        <div class="field">
          <label for="f_sizeType">Size type</label>
          <select id="f_sizeType">
            <option value="standard">Standard (single size list)</option>
            <option value="waist_length">Waist × Length</option>
          </select>
        </div>
        <div class="field">
          <label for="f_lowStockThreshold">Low stock threshold</label>
          <input type="number" id="f_lowStockThreshold" min="0" value="5" />
        </div>
        <div class="field">
          <label for="f_material">Material (short filter label)</label>
          <input type="text" id="f_material" placeholder="e.g. Pure Cotton Unstitched" />
        </div>
        <div class="field">
          <label for="f_stretch">Stretch</label>
          <select id="f_stretch">
            <option value="none">No Stretch</option>
            <option value="low">Some Stretch</option>
            <option value="high">High Stretch</option>
          </select>
        </div>
        <div class="field full">
          <label for="f_collection">Collection / Drop</label>
          <input type="text" id="f_collection" placeholder="e.g. Core, New Arrivals, Limited Edition" />
        </div>
        <div class="field full">
          <label for="f_tags">Tags (comma-separated)</label>
          <input type="text" id="f_tags" placeholder="unstitched, cotton, new arrival" />
        </div>
        <div class="field full">
          <label for="f_completeTheLook">Complete the Look — product slugs (comma-separated)</label>
          <input type="text" id="f_completeTheLook" placeholder="vw-201, vw-305" />
        </div>
        <div class="field full">
          <label for="f_frequentlyBoughtWith">Frequently Bought Together — product slugs (comma-separated)</label>
          <input type="text" id="f_frequentlyBoughtWith" placeholder="vw-201, vw-305" />
        </div>
        <div class="field full">
          <label for="f_estimatedDelivery">Estimated delivery (leave blank for store default)</label>
          <input type="text" id="f_estimatedDelivery" />
        </div>
        <div class="field full">
          <label for="f_returnPolicy">Return policy (leave blank for store default)</label>
          <input type="text" id="f_returnPolicy" />
        </div>
        <div class="field full checkbox-row">
          <input type="checkbox" id="f_active" checked style="width:16px;height:16px" />
          <label for="f_active" style="text-transform:none;font-family:var(--font-body);font-size:13px">Active (visible on storefront)</label>
        </div>
        <div class="field full checkbox-row">
          <input type="checkbox" id="f_isBestseller" style="width:16px;height:16px" />
          <label for="f_isBestseller" style="text-transform:none;font-family:var(--font-body);font-size:13px">Feature in homepage Best Sellers row</label>
        </div>
      </div>
      <p id="formError" style="display:none;color:var(--accent);font-size:13px;margin-top:12px"></p>
      <div class="modal-actions">
        <button type="submit" class="btn" id="saveBtn">Save Product</button>
        <button type="button" class="btn outline" id="cancelBtn">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="js/admin.js"></script>
<script>
  mountAdminChrome("products");

  let currentProducts = [];

  function stockBadge(p) {
    const stockBySize = p.stock_by_size || {};
    const threshold = p.low_stock_threshold ?? 5;
    const sizes = p.sizes || [];
    if (sizes.length && sizes.every((s) => Number(stockBySize[s] ?? 0) <= 0)) {
      return `<span class="status-pill cancelled">Out of Stock</span>`;
    }
    const anyLow = sizes.some((s) => {
      const n = Number(stockBySize[s] ?? 0);
      return n > 0 && n <= threshold;
    });
    return anyLow ? `<span class="status-pill pending">Low Stock</span>` : "";
  }

  function rowHTML(p) {
    const onSale = p.sale_price != null;
    return `
      <tr>
        <td><img class="table-thumb" src="${p.image}" alt="" /></td>
        <td>${p.name}${p.is_bestseller ? ' <span title="Bestseller">⭐</span>' : ""}<br><span style="color:var(--ink-soft);font-size:11.5px;font-family:var(--font-mono)">${p.slug}</span></td>
        <td>${p.category}</td>
        <td>${onSale ? `<span style="text-decoration:line-through;color:var(--ink-soft)">${formatPKR(p.price)}</span> ${formatPKR(p.sale_price)}` : formatPKR(p.price)}</td>
        <td>${p.stock} ${stockBadge(p)}</td>
        <td>${p.active ? '<span class="status-pill delivered">Active</span>' : '<span class="status-pill cancelled">Hidden</span>'}</td>
        <td>
          <div class="row-actions">
            <button data-edit="${p.id}">Edit</button>
            <button data-delete="${p.id}" class="danger">Delete</button>
          </div>
        </td>
      </tr>`;
  }

  function isLowOrOutOfStock(p) {
    const stockBySize = p.stock_by_size || {};
    const threshold = p.low_stock_threshold ?? 5;
    const sizes = p.sizes || [];
    if (!sizes.length) return false;
    return sizes.some((s) => Number(stockBySize[s] ?? 0) <= threshold);
  }

  function renderTable() {
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    const cat = document.getElementById("categoryFilter").value;
    const lowStockOnly = document.getElementById("lowStockOnly").checked;
    let list = currentProducts;
    if (cat !== "all") list = list.filter((p) => p.category === cat);
    if (q) list = list.filter((p) => `${p.name} ${p.slug}`.toLowerCase().includes(q));
    if (lowStockOnly) list = list.filter(isLowOrOutOfStock);

    const body = document.getElementById("productsBody");
    body.innerHTML = list.length ? list.map(rowHTML).join("") : `<tr class="empty-row"><td colspan="7">No products match.</td></tr>`;

    body.querySelectorAll("[data-edit]").forEach((btn) => {
      btn.addEventListener("click", () => openModal(currentProducts.find((p) => p.id === Number(btn.dataset.edit))));
    });
    body.querySelectorAll("[data-delete]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const p = currentProducts.find((x) => x.id === Number(btn.dataset.delete));
        if (!confirm(`Delete "${p.name}"? This can't be undone.`)) return;
        try {
          await adminFetch(`/api/admin/products/${p.id}`, { method: "DELETE" });
          currentProducts = currentProducts.filter((x) => x.id !== p.id);
          renderTable();
        } catch (err) {
          alert(err.message);
        }
      });
    });
  }

  const modal = document.getElementById("productModal");
  const form = document.getElementById("productForm");
  const stockFieldsContainer = document.getElementById("stockBySizeFields");

  function renderStockBySizeFields(sizes, existingStock) {
    const stock = existingStock || {};
    stockFieldsContainer.innerHTML = sizes
      .map(
        (s) => `
        <div style="display:flex;flex-direction:column;gap:4px;width:70px">
          <span style="font-family:var(--font-mono);font-size:11px;text-align:center">${s}</span>
          <input type="number" min="0" data-stock-size="${s}" value="${stock[s] !== undefined ? stock[s] : 0}"
            style="padding:8px 6px;border:1px solid var(--line);font-family:var(--font-mono);font-size:12px;text-align:center" />
        </div>`
      )
      .join("");
  }

  function currentSizesList() {
    return document.getElementById("f_sizes").value.split(",").map((s) => s.trim()).filter(Boolean);
  }

  function readStockBySizeFields() {
    const result = {};
    stockFieldsContainer.querySelectorAll("[data-stock-size]").forEach((input) => {
      result[input.dataset.stockSize] = Math.max(0, Number(input.value) || 0);
    });
    return result;
  }

  // Preserve already-typed stock numbers when sizes are edited, rather than
  // wiping the whole per-size stock section on every keystroke.
  document.getElementById("f_sizes").addEventListener("input", () => {
    renderStockBySizeFields(currentSizesList(), readStockBySizeFields());
  });

  function openModal(product) {
    document.getElementById("formError").style.display = "none";
    form.reset();
    if (product) {
      document.getElementById("modalTitle").textContent = "Edit Product";
      document.getElementById("productDbId").value = product.id;
      document.getElementById("f_slug").value = product.slug;
      document.getElementById("f_name").value = product.name;
      document.getElementById("f_category").value = product.category;
      document.getElementById("f_fit").value = product.fit;
      document.getElementById("f_color").value = product.color;
      document.getElementById("f_badge").value = product.badge || "";
      document.getElementById("f_price").value = product.price;
      document.getElementById("f_salePrice").value = product.sale_price ?? "";
      document.getElementById("f_sizes").value = (product.sizes || []).join(", ");
      document.getElementById("f_image").value = product.image;
      document.getElementById("f_images").value = (product.images || []).join(", ");
      document.getElementById("f_videoUrl").value = product.video_url || "";
      document.getElementById("f_description").value = product.description || "";
      document.getElementById("f_fabric").value = product.fabric || "";
      document.getElementById("f_care").value = product.care || "";
      document.getElementById("f_sku").value = product.sku || "";
      document.getElementById("f_styleCode").value = product.style_code || "";
      document.getElementById("f_sizeType").value = product.size_type || "standard";
      document.getElementById("f_lowStockThreshold").value = product.low_stock_threshold ?? 5;
      document.getElementById("f_tags").value = (product.tags || []).join(", ");
      document.getElementById("f_material").value = product.material || "";
      document.getElementById("f_stretch").value = product.stretch || "none";
      document.getElementById("f_collection").value = product.collection || "";
      document.getElementById("f_completeTheLook").value = (product.complete_the_look || []).join(", ");
      document.getElementById("f_frequentlyBoughtWith").value = (product.frequently_bought_with || []).join(", ");
      document.getElementById("f_estimatedDelivery").value = product.estimated_delivery || "";
      document.getElementById("f_returnPolicy").value = product.return_policy || "";
      document.getElementById("f_active").checked = product.active;
      document.getElementById("f_isBestseller").checked = Boolean(product.is_bestseller);
      renderStockBySizeFields(product.sizes || [], product.stock_by_size || {});
    } else {
      document.getElementById("modalTitle").textContent = "Add Product";
      document.getElementById("productDbId").value = "";
      document.getElementById("f_active").checked = true;
      document.getElementById("f_isBestseller").checked = false;
      document.getElementById("f_sizeType").value = "standard";
      document.getElementById("f_lowStockThreshold").value = 5;
      document.getElementById("f_stretch").value = "none";
      renderStockBySizeFields([], {});
    }
    modal.classList.add("open");
  }
  function closeModal() { modal.classList.remove("open"); }

  document.getElementById("newProductBtn").addEventListener("click", () => openModal(null));
  document.getElementById("closeModal").addEventListener("click", closeModal);
  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("formError");
    errorEl.style.display = "none";
    const id = document.getElementById("productDbId").value;

    const sizes = document.getElementById("f_sizes").value.split(",").map((s) => s.trim()).filter(Boolean);
    const salePriceRaw = document.getElementById("f_salePrice").value;

    const splitList = (id) =>
      document.getElementById(id).value.split(",").map((s) => s.trim()).filter(Boolean);

    const body = {
      slug: document.getElementById("f_slug").value.trim(),
      name: document.getElementById("f_name").value.trim(),
      category: document.getElementById("f_category").value,
      fit: document.getElementById("f_fit").value,
      color: document.getElementById("f_color").value.trim(),
      badge: document.getElementById("f_badge").value || null,
      price: Number(document.getElementById("f_price").value),
      salePrice: salePriceRaw ? Number(salePriceRaw) : null,
      sizes,
      stockBySize: readStockBySizeFields(),
      image: document.getElementById("f_image").value.trim(),
      images: splitList("f_images"),
      videoUrl: document.getElementById("f_videoUrl").value.trim() || null,
      description: document.getElementById("f_description").value.trim(),
      fabric: document.getElementById("f_fabric").value.trim(),
      care: document.getElementById("f_care").value.trim(),
      sku: document.getElementById("f_sku").value.trim() || null,
      styleCode: document.getElementById("f_styleCode").value.trim() || null,
      sizeType: document.getElementById("f_sizeType").value,
      lowStockThreshold: Number(document.getElementById("f_lowStockThreshold").value) || 0,
      tags: splitList("f_tags"),
      material: document.getElementById("f_material").value.trim() || null,
      stretch: document.getElementById("f_stretch").value,
      collection: document.getElementById("f_collection").value.trim() || null,
      completeTheLook: splitList("f_completeTheLook"),
      frequentlyBoughtWith: splitList("f_frequentlyBoughtWith"),
      estimatedDelivery: document.getElementById("f_estimatedDelivery").value.trim() || null,
      returnPolicy: document.getElementById("f_returnPolicy").value.trim() || null,
      active: document.getElementById("f_active").checked,
      isBestseller: document.getElementById("f_isBestseller").checked,
    };

    try {
      if (id) {
        const updated = await adminFetch(`/api/admin/products/${id}`, { method: "PATCH", body: JSON.stringify(body) });
        currentProducts = currentProducts.map((p) => (p.id === updated.id ? updated : p));
      } else {
        const created = await adminFetch("/api/admin/products", { method: "POST", body: JSON.stringify(body) });
        currentProducts.push(created);
      }
      closeModal();
      renderTable();
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = "block";
    }
  });

  document.getElementById("searchInput").addEventListener("input", renderTable);
  document.getElementById("categoryFilter").addEventListener("change", renderTable);
  document.getElementById("lowStockOnly").addEventListener("change", renderTable);

  (async () => {
    try {
      currentProducts = await adminFetch("/api/admin/products");
      renderTable();
    } catch (err) {
      document.getElementById("productsBody").innerHTML = `<tr class="empty-row"><td colspan="7">${err.message}</td></tr>`;
    }
  })();
</script>
</body>
</html>
