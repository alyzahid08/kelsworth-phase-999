<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="/images/brand/logo-alqutuz.png" type="image/png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Products — AL-QUTUZ Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <div><h1>Products</h1><p>Manage the Wash &amp; Wear and Cotton fabric catalog.</p></div>
      <button class="btn" id="newProductBtn">+ Add Product</button>
    </div>
    <div class="toolbar"><div class="toolbar-left">
      <input type="text" id="searchInput" placeholder="Search products…" />
      <select id="categoryFilter"><option value="all">All categories</option><option value="wash-n-wear">Wash &amp; Wear</option><option value="cotton">Cotton</option></select>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="lowStockOnly" style="width:15px;height:15px" /> Low stock only</label>
    </div></div>
    <div class="table-scroll"><table><thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody id="productsBody"><tr class="empty-row"><td colspan="7">Loading…</td></tr></tbody></table></div>
  </main>
</div>
<div class="modal-overlay" id="productModal"><div class="modal-box">
  <button class="modal-close" id="closeModal">✕</button><h3 id="modalTitle">Add Product</h3>
  <form id="productForm">
    <input type="hidden" id="productDbId" />
    <div class="form-grid">
      <div class="field"><label for="f_slug">Slug (URL id)</label><input type="text" id="f_slug" placeholder="alq-ww-black" required /></div>
      <div class="field"><label for="f_name">Product name</label><input type="text" id="f_name" placeholder="Premium Wash &amp; Wear — Black" required /></div>
      <div class="field"><label for="f_category">Category</label><select id="f_category" required><option value="wash-n-wear">Wash &amp; Wear</option><option value="cotton">Cotton</option></select></div>
      <div class="field"><label for="f_color">Color</label><input type="text" id="f_color" placeholder="Deep Black" required /></div>
      <div class="field"><label for="f_price">Price (Rs.)</label><input type="number" id="f_price" min="0" required /></div>
      <div class="field"><label for="f_salePrice">Sale price (optional)</label><input type="number" id="f_salePrice" min="0" /></div>
      <div class="field"><label for="f_stock">Available stock (fabric lengths)</label><input type="number" id="f_stock" min="0" value="0" required /></div>
      <div class="field"><label for="f_badge">Badge</label><select id="f_badge"><option value="">None</option><option value="New">New</option><option value="Sale">Sale</option></select></div>
      <div class="field full"><label for="f_imageFile">Primary product image from your computer</label><input type="file" id="f_imageFile" accept="image/jpeg,image/png,image/webp,image/gif" /><p class="upload-help">Choose a JPG, PNG, WEBP, or GIF. The file is uploaded to this store when you save.</p><div id="uploadPreview" class="upload-preview"></div></div>
      <div class="field full"><label for="f_galleryFiles">Additional gallery images (optional)</label><input type="file" id="f_galleryFiles" accept="image/jpeg,image/png,image/webp,image/gif" multiple /><p class="upload-help">You can select up to 8 images at once. Existing image URLs can remain below.</p></div>
      <div class="field full"><label for="f_image">Current primary image URL</label><input type="text" id="f_image" placeholder="Uploaded image URL appears here" required /></div>
      <div class="field full"><label for="f_images">Current gallery image URLs (comma-separated)</label><input type="text" id="f_images" placeholder="/images/uploads/another-view.webp" /></div>
      <div class="field full"><label for="f_description">Description</label><textarea id="f_description" rows="3" placeholder="Describe the fabric, finish, and ideal use."></textarea></div>
      <div class="field"><label for="f_fabric">Fabric composition</label><input type="text" id="f_fabric" placeholder="65% polyester, 35% cotton" /></div>
      <div class="field"><label for="f_care">Care instructions</label><input type="text" id="f_care" placeholder="Machine wash cold" /></div>
      <div class="field"><label for="f_material">Material label</label><input type="text" id="f_material" placeholder="Premium Wash &amp; Wear" /></div>
      <div class="field"><label for="f_collection">Collection / drop</label><input type="text" id="f_collection" placeholder="Core, New Arrivals, Eid Edit" /></div>
      <div class="field full"><label for="f_tags">Tags (comma-separated)</label><input type="text" id="f_tags" placeholder="wash &amp; wear, unstitched, black" /></div>
      <div class="field full"><label for="f_estimatedDelivery">Estimated delivery</label><input type="text" id="f_estimatedDelivery" placeholder="3–5 working days in major cities" /></div>
      <div class="field full"><label for="f_returnPolicy">Return policy</label><input type="text" id="f_returnPolicy" placeholder="Free exchange within 14 days of delivery" /></div>
      <div class="field full checkbox-row"><input type="checkbox" id="f_active" checked /><label for="f_active">Active (visible on storefront)</label></div>
      <div class="field full checkbox-row"><input type="checkbox" id="f_isBestseller" /><label for="f_isBestseller">Feature in homepage Best Sellers row</label></div>
    </div>
    <p id="formError" style="display:none;color:var(--accent);font-size:13px;margin-top:12px"></p>
    <div class="modal-actions"><button type="submit" class="btn" id="saveBtn">Save Product</button><button type="button" class="btn outline" id="cancelBtn">Cancel</button></div>
  </form>
</div></div>
<script src="js/admin.js?v=20260827"></script>
<script src="js/bootstrap.js?v=20260827"></script>
<script>
let currentProducts = [];
const modal = document.getElementById("productModal");
const form = document.getElementById("productForm");
const imageFile = document.getElementById("f_imageFile");
const galleryFiles = document.getElementById("f_galleryFiles");
function formatCategory(c) { return c === "wash-n-wear" ? "Wash & Wear" : "Cotton"; }
function stockBadge(p) { return Number(p.stock) <= 5 ? `<span class="status-pill ${Number(p.stock) === 0 ? "cancelled" : "pending"}">${Number(p.stock) === 0 ? "Out of stock" : "Low stock"}</span>` : ""; }
function rowHTML(p) { const onSale = p.sale_price != null; return `<tr><td><img class="table-thumb" src="${p.image}" alt="" /></td><td>${p.name}<br><span class="muted-mono">${p.slug}</span></td><td>${formatCategory(p.category)}</td><td>${onSale ? `<span style="text-decoration:line-through;color:var(--ink-soft)">${formatPKR(p.price)}</span> ${formatPKR(p.sale_price)}` : formatPKR(p.price)}</td><td>${p.stock} ${stockBadge(p)}</td><td>${p.active ? '<span class="status-pill delivered">Active</span>' : '<span class="status-pill cancelled">Hidden</span>'}</td><td><div class="row-actions"><button data-edit="${p.id}">Edit</button><button data-delete="${p.id}" class="danger">Delete</button></div></td></tr>`; }
function renderTable() { const q = document.getElementById("searchInput").value.trim().toLowerCase(); const cat = document.getElementById("categoryFilter").value; const low = document.getElementById("lowStockOnly").checked; let list = currentProducts.filter((p) => (cat === "all" || p.category === cat) && (!q || `${p.name} ${p.slug}`.toLowerCase().includes(q)) && (!low || Number(p.stock) <= 5)); const body = document.getElementById("productsBody"); body.innerHTML = list.length ? list.map(rowHTML).join("") : `<tr class="empty-row"><td colspan="7">No products match.</td></tr>`; body.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => openModal(currentProducts.find((p) => p.id === Number(b.dataset.edit))))); body.querySelectorAll("[data-delete]").forEach((b) => b.addEventListener("click", async () => { const p = currentProducts.find((x) => x.id === Number(b.dataset.delete)); if (!confirm(`Delete "${p.name}"?`)) return; try { await adminFetch(`/api/admin/products/${p.id}`, { method: "DELETE" }); currentProducts = currentProducts.filter((x) => x.id !== p.id); renderTable(); } catch (e) { alert(e.message); } })); }
function splitList(id) { return document.getElementById(id).value.split(",").map((s) => s.trim()).filter(Boolean); }
function showPreview(files) { const mount = document.getElementById("uploadPreview"); mount.innerHTML = ""; [...files].slice(0, 8).forEach((file) => { const img = document.createElement("img"); img.alt = file.name; img.src = URL.createObjectURL(file); mount.appendChild(img); }); }
imageFile.addEventListener("change", () => showPreview(imageFile.files));
galleryFiles.addEventListener("change", () => showPreview([...imageFile.files, ...galleryFiles.files]));
function openModal(product) { document.getElementById("formError").style.display = "none"; form.reset(); document.getElementById("uploadPreview").innerHTML = ""; if (product) { document.getElementById("modalTitle").textContent = "Edit Product"; document.getElementById("productDbId").value = product.id; document.getElementById("f_slug").value = product.slug; document.getElementById("f_name").value = product.name; document.getElementById("f_category").value = ["cotton", "wash-n-wear"].includes(product.category) ? product.category : "wash-n-wear"; document.getElementById("f_color").value = product.color || ""; document.getElementById("f_price").value = product.price; document.getElementById("f_salePrice").value = product.sale_price ?? ""; document.getElementById("f_stock").value = product.stock ?? 0; document.getElementById("f_badge").value = product.badge || ""; document.getElementById("f_image").value = product.image || ""; document.getElementById("f_images").value = (product.images || []).join(", "); document.getElementById("f_description").value = product.description || ""; document.getElementById("f_fabric").value = product.fabric || ""; document.getElementById("f_care").value = product.care || ""; document.getElementById("f_material").value = product.material || ""; document.getElementById("f_collection").value = product.collection || ""; document.getElementById("f_tags").value = (product.tags || []).join(", "); document.getElementById("f_estimatedDelivery").value = product.estimated_delivery || ""; document.getElementById("f_returnPolicy").value = product.return_policy || ""; document.getElementById("f_active").checked = product.active; document.getElementById("f_isBestseller").checked = Boolean(product.is_bestseller); } else { document.getElementById("modalTitle").textContent = "Add Product"; document.getElementById("f_active").checked = true; document.getElementById("f_stock").value = 0; } modal.classList.add("open"); }
function closeModal() { modal.classList.remove("open"); }
async function uploadSelectedImages() { const files = [...imageFile.files, ...galleryFiles.files].slice(0, 8); if (!files.length) return []; const fd = new FormData(); files.forEach((f) => fd.append("images", f)); const res = await fetch("/api/admin/uploads/images", { method: "POST", body: fd }); const data = await res.json(); if (!res.ok) throw new Error(data.error || "Could not upload images"); return data.images || []; }
document.getElementById("newProductBtn").addEventListener("click", () => openModal(null)); document.getElementById("closeModal").addEventListener("click", closeModal); document.getElementById("cancelBtn").addEventListener("click", closeModal); modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
form.addEventListener("submit", async (e) => { e.preventDefault(); const errorEl = document.getElementById("formError"); errorEl.style.display = "none"; const btn = document.getElementById("saveBtn"); btn.disabled = true; btn.textContent = "Uploading…"; try { const uploaded = await uploadSelectedImages(); const image = uploaded[0] || document.getElementById("f_image").value.trim(); if (!image) throw new Error("Choose a primary product image or enter an image URL"); const existingGallery = splitList("f_images"); const body = { slug: document.getElementById("f_slug").value.trim(), name: document.getElementById("f_name").value.trim(), category: document.getElementById("f_category").value, color: document.getElementById("f_color").value.trim(), price: Number(document.getElementById("f_price").value), salePrice: document.getElementById("f_salePrice").value ? Number(document.getElementById("f_salePrice").value) : null, stock: Math.max(0, Number(document.getElementById("f_stock").value) || 0), sizes: [], stockBySize: {}, image, images: uploaded.length > 1 ? [...uploaded, ...existingGallery] : existingGallery, badge: document.getElementById("f_badge").value || null, description: document.getElementById("f_description").value.trim(), fabric: document.getElementById("f_fabric").value.trim(), care: document.getElementById("f_care").value.trim(), material: document.getElementById("f_material").value.trim() || null, collection: document.getElementById("f_collection").value.trim() || null, tags: splitList("f_tags"), estimatedDelivery: document.getElementById("f_estimatedDelivery").value.trim() || null, returnPolicy: document.getElementById("f_returnPolicy").value.trim() || null, active: document.getElementById("f_active").checked, isBestseller: document.getElementById("f_isBestseller").checked }; const id = document.getElementById("productDbId").value; const saved = id ? await adminFetch(`/api/admin/products/${id}`, { method: "PATCH", body: JSON.stringify(body) }) : await adminFetch("/api/admin/products", { method: "POST", body: JSON.stringify(body) }); if (id) currentProducts = currentProducts.map((p) => p.id === saved.id ? saved : p); else currentProducts.push(saved); closeModal(); renderTable(); } catch (err) { errorEl.textContent = err.message; errorEl.style.display = "block"; } finally { btn.disabled = false; btn.textContent = "Save Product"; } });
document.getElementById("searchInput").addEventListener("input", renderTable); document.getElementById("categoryFilter").addEventListener("change", renderTable); document.getElementById("lowStockOnly").addEventListener("change", renderTable);
(async () => { try { currentProducts = await adminFetch("/api/admin/products"); renderTable(); } catch (e) { document.getElementById("productsBody").innerHTML = `<tr class="empty-row"><td colspan="7">${e.message}</td></tr>`; } })();
</script>
</body></html>
