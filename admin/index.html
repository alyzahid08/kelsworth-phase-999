<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="/images/brand/logo-alqutuz.png" type="image/png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Orders — AL-QUTUZ Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1>Orders</h1>
        <p>Everything placed through the storefront checkout.</p>
      </div>
    </div>

    <div class="stat-row" id="statRow"></div>

    <div class="toolbar">
      <div class="toolbar-left">
        <input type="text" id="searchInput" placeholder="Search order #, name, email, phone…" style="width:280px" />
        <select id="statusFilter">
          <option value="all">All statuses</option>
          <option value="pending">Pending</option>
          <option value="processing">Processing</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <button class="btn outline" id="exportCsvBtn" type="button">Export CSV</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Order #</th>
          <th>Customer</th>
          <th>Payment</th>
          <th>City</th>
          <th>Total</th>
          <th>Status</th>
          <th>Confirmation</th>
          <th>Placed</th>
        </tr>
      </thead>
      <tbody id="ordersBody">
        <tr class="empty-row"><td colspan="8">Loading…</td></tr>
      </tbody>
    </table>
  </main>
</div>

<div class="modal-overlay" id="orderModal">
  <div class="modal-box" id="orderModalBody"></div>
</div>

<script src="js/admin.js?v=20260827"></script>
<script src="js/bootstrap.js?v=20260827"></script>
<script>

  let currentOrders = [];

  function statRowHTML(orders) {
    const total = orders.length;
    const pending = orders.filter((o) => o.status === "pending").length;
    const revenue = orders
      .filter((o) => o.status !== "cancelled")
      .reduce((sum, o) => sum + Number(o.total), 0);
    const delivered = orders.filter((o) => o.status === "delivered").length;
    return `
      <div class="stat-card"><div class="stat-label">Total Orders</div><div class="stat-value">${total}</div></div>
      <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value">${pending}</div></div>
      <div class="stat-card"><div class="stat-label">Delivered</div><div class="stat-value">${delivered}</div></div>
      <div class="stat-card"><div class="stat-label">Revenue (net of cancelled)</div><div class="stat-value" style="font-size:24px">${formatPKR(revenue)}</div></div>`;
  }

  function confirmationBadgeHTML(o) {
    const badges = {
      confirmed: { icon: "🟢", label: "Confirmed" },
      pending: { icon: "🟡", label: "Awaiting reply" },
      expired: { icon: "🔴", label: "Unconfirmed" },
      not_required: { icon: "—", label: "Prepaid" },
    };
    const b = badges[o.confirmation_status] || badges.not_required;
    return `<span title="${b.label}">${b.icon} ${b.label}</span>`;
  }

  function rowHTML(o) {
    return `
      <tr>
        <td><a href="#" data-open="${o.id}" style="text-decoration:underline">${o.order_number}</a></td>
        <td>${o.first_name} ${o.last_name}<br><span style="color:var(--ink-soft);font-size:12px">${o.email}</span></td>
        <td style="font-family:var(--font-mono);font-size:11.5px">${(o.payment_method || 'cod').toUpperCase()}</td>
        <td>${o.city}</td>
        <td>${formatPKR(o.total)}</td>
        <td>
          <select class="status-select" data-status-for="${o.id}">
            ${["pending", "processing", "shipped", "delivered", "cancelled"]
              .map((s) => `<option value="${s}" ${s === o.status ? "selected" : ""}>${s[0].toUpperCase() + s.slice(1)}</option>`)
              .join("")}
          </select>
        </td>
        <td style="font-size:12.5px">${confirmationBadgeHTML(o)}</td>
        <td>${formatDate(o.created_at)}</td>
      </tr>`;
  }

  function renderTable() {
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    const status = document.getElementById("statusFilter").value;
    let list = currentOrders;
    if (status !== "all") list = list.filter((o) => o.status === status);
    if (q) {
      list = list.filter((o) =>
        [o.order_number, o.email, o.phone, `${o.first_name} ${o.last_name}`]
          .join(" ")
          .toLowerCase()
          .includes(q)
      );
    }
    const body = document.getElementById("ordersBody");
    body.innerHTML = list.length
      ? list.map(rowHTML).join("")
      : `<tr class="empty-row"><td colspan="8">No orders match.</td></tr>`;

    document.getElementById("statRow").innerHTML = statRowHTML(currentOrders);

    body.querySelectorAll("[data-open]").forEach((a) => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        openOrderModal(Number(a.dataset.open));
      });
    });
    body.querySelectorAll("[data-status-for]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        const id = Number(sel.dataset.statusFor);
        try {
          await adminFetch(`/api/admin/orders/${id}`, {
            method: "PATCH",
            body: JSON.stringify({ status: sel.value }),
          });
          const o = currentOrders.find((x) => x.id === id);
          if (o) o.status = sel.value;
          document.getElementById("statRow").innerHTML = statRowHTML(currentOrders);
        } catch (err) {
          alert(err.message);
        }
      });
    });
  }

  async function openOrderModal(id) {
    const modal = document.getElementById("orderModal");
    const body = document.getElementById("orderModalBody");
    body.innerHTML = "Loading…";
    modal.classList.add("open");
    try {
      const o = await adminFetch(`/api/admin/orders/${id}`);
      body.innerHTML = `
        <button class="modal-close" id="closeModal">✕</button>
        <h3>Order ${o.order_number}</h3>
        <p style="font-size:13px;color:var(--ink-soft);margin-bottom:18px">Placed ${formatDate(o.created_at)}</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;font-size:13.5px">
          <div><strong>Customer</strong><br>${o.first_name} ${o.last_name}<br>${o.email}<br>${o.phone}</div>
          <div><strong>Ship to</strong><br>${o.address}<br>${o.city} ${o.postal_code || ""}</div>
        </div>
        ${o.delivery_notes ? `<p style="font-size:13px;background:var(--paper-alt);border:1px dashed var(--line);padding:10px 12px;margin-bottom:12px"><strong>Delivery notes:</strong> ${o.delivery_notes}</p>` : ""}
        ${o.gift_message ? `<p style="font-size:13px;background:var(--paper-alt);border:1px dashed var(--line);padding:10px 12px;margin-bottom:12px">🎁 <strong>Gift message:</strong> ${o.gift_message}</p>` : ""}
        <table style="margin-bottom:16px">
          <thead><tr><th>Item</th><th>Product type</th><th>Qty</th><th>Unit</th><th>Line Total</th></tr></thead>
          <tbody>
            ${o.items
              .map(
                (i) => `<tr><td>${i.product_name}</td><td>Unstitched length</td><td>${i.qty}</td><td>${formatPKR(i.unit_price)}</td><td>${formatPKR(i.unit_price * i.qty)}</td></tr>`
              )
              .join("")}
          </tbody>
        </table>
        <div style="text-align:right;font-family:var(--font-mono);font-size:13px;line-height:1.9">
          Subtotal: ${formatPKR(o.subtotal)}<br>
          Shipping: ${o.shipping === 0 ? "Free" : formatPKR(o.shipping)}<br>
          ${o.tax ? `Tax: ${formatPKR(o.tax)}<br>` : ""}
          ${o.discount ? `Discount${o.promo_code ? ` (${o.promo_code})` : ""}: −${formatPKR(o.discount)}<br>` : ""}
          <strong style="font-size:16px">Total: ${formatPKR(o.total)}</strong>
        </div>
        <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          ${o.tracking_number ? `<span style="font-family:var(--font-mono);font-size:12px;color:var(--ink-soft)">Tracking: ${o.tracking_number}</span>` : ''}
          <span style="font-family:var(--font-mono);font-size:12px;color:var(--ink-soft)">Payment: ${(o.payment_method || 'cod').toUpperCase()} ${o.payment_status && o.payment_status !== 'pending' ? '(' + o.payment_status + ')' : ''}</span>
          <a href="/api/orders/${o.id}/invoice" target="_blank" style="font-family:var(--font-mono);font-size:12px;text-decoration:underline;color:var(--bronze)">Download Invoice PDF</a>
        </div>
        <div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <span style="font-family:var(--font-mono);font-size:12px;color:var(--ink-soft)">WhatsApp confirmation: ${confirmationBadgeHTML(o)}</span>
          ${(o.confirmation_status === "pending" || o.confirmation_status === "expired")
            ? `<button class="btn outline" id="manualConfirmBtn" type="button" style="padding:6px 14px;font-size:12px">Mark Confirmed (called customer)</button>`
            : ""}
        </div>
      `;
      document.getElementById("closeModal").addEventListener("click", () => modal.classList.remove("open"));
      const confirmBtn = document.getElementById("manualConfirmBtn");
      if (confirmBtn) {
        confirmBtn.addEventListener("click", async () => {
          confirmBtn.disabled = true;
          confirmBtn.textContent = "Confirming…";
          try {
            await adminFetch(`/api/admin/orders/${o.id}/confirm`, { method: "POST" });
            const co = currentOrders.find((x) => x.id === o.id);
            if (co) co.confirmation_status = "confirmed";
            renderTable();
            openOrderModal(o.id);
          } catch (err) {
            alert(err.message);
            confirmBtn.disabled = false;
            confirmBtn.textContent = "Mark Confirmed (called customer)";
          }
        });
      }
    } catch (err) {
      body.innerHTML = `<p style="color:var(--accent)">${err.message}</p>`;
    }
  }
  document.getElementById("orderModal").addEventListener("click", (e) => {
    if (e.target.id === "orderModal") e.currentTarget.classList.remove("open");
  });

  document.getElementById("searchInput").addEventListener("input", renderTable);
  document.getElementById("statusFilter").addEventListener("change", renderTable);

  function currentFilteredOrders() {
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    const status = document.getElementById("statusFilter").value;
    let list = currentOrders;
    if (status !== "all") list = list.filter((o) => o.status === status);
    if (q) {
      list = list.filter((o) =>
        [o.order_number, o.email, o.phone, `${o.first_name} ${o.last_name}`].join(" ").toLowerCase().includes(q)
      );
    }
    return list;
  }

  function csvEscape(val) {
    const s = String(val ?? "");
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }

  document.getElementById("exportCsvBtn").addEventListener("click", () => {
    const rows = currentFilteredOrders();
    const headers = ["Order #", "Status", "Customer", "Email", "Phone", "City", "Subtotal", "Shipping", "Discount", "Total", "Placed"];
    const lines = [headers.join(",")];
    rows.forEach((o) => {
      lines.push(
        [
          o.order_number, o.status, `${o.first_name} ${o.last_name}`, o.email, o.phone, o.city,
          o.subtotal, o.shipping, o.discount, o.total, formatDate(o.created_at),
        ].map(csvEscape).join(",")
      );
    });
    const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `alqutuz-orders-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  (async () => {
    try {
      currentOrders = await adminFetch("/api/admin/orders");
      renderTable();
    } catch (err) {
      document.getElementById("ordersBody").innerHTML = `<tr class="empty-row"><td colspan="8">${err.message}</td></tr>`;
    }
  })();
</script>
</body>
</html>
